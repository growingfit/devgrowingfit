<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Athletics / Sprinter Stickman -->
  <!-- Horizontal Speed / Motion Lines behind runner -->
  <line x1="6" y1="23" x2="16" y2="23" stroke="#172033" stroke-width="3" stroke-linecap="round" />
  <line x1="4" y1="30" x2="18" y2="30" stroke="#172033" stroke-width="3" stroke-linecap="round" />
  <line x1="8" y1="37" x2="17" y2="37" stroke="#172033" stroke-width="3" stroke-linecap="round" />
  <!-- Head leaning forward in sprint -->
  <circle cx="38" cy="15" r="5" fill="#172033" />
  <!-- Torso forward lean -->
  <path d="M36 20 L30 35" stroke="#172033" stroke-width="4.5" stroke-linecap="round" />
  <!-- Arms pumping -->
  <path d="M34 23 L42 27 L49 22" stroke="#172033" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M34 23 L26 27 L20 22" stroke="#172033" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Running legs in high knee sprint stride -->
  <path d="M30 35 L40 38 L43 49" stroke="#172033" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M30 35 L22 41 L17 48" stroke="#172033" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" />
</svg>
