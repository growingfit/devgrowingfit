<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Martial Arts High Side Kick Stickman -->
  <!-- Head -->
  <circle cx="25" cy="15" r="5" fill="#172033" />
  <!-- Headband knot/ponytail flick -->
  <path d="M20 15 C17 14 15 17 13 18" stroke="#172033" stroke-width="2.5" stroke-linecap="round" />
  <!-- Torso (leaning slightly back) -->
  <path d="M26 20 L27 36" stroke="#172033" stroke-width="4.5" stroke-linecap="round" />
  <!-- Standing Leg -->
  <path d="M27 36 L26 46 L27 55" stroke="#172033" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" />
  <!-- High Side Kick Leg -->
  <path d="M27 36 L38 29 L51 19" stroke="#172033" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Left Guard Arm -->
  <path d="M26 24 L20 28 L19 35" stroke="#172033" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Right Guard Arm -->
  <path d="M26 24 L33 22 L36 17" stroke="#172033" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
</svg>
